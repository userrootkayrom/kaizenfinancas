<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar | Kaizen Finanças</title>
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <meta name="theme-color" content="#102a43">
    <style>
        :root {
            --primary: #3b82f6;
            --background: #0b0f19;
            --surface: #111827;
            --text: #f9fafb;
            --text-light: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 0.9rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--background);
            color: var(--text);
            outline: none;
            transition: 0.3s;
        }

        .form-group input.input-error {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
        }

        .btn-auth {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-google {
            width: 100%;
            background: white;
            color: #333;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth-switch {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .auth-switch span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: -0.6rem;
            color: var(--primary);
            font-size: 0.8rem;
            cursor: pointer;
        }

        .error-message {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1.5rem;
            display: none;
        }

        .success-message {
            color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 1.5rem;
            display: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-light);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider:not(:empty)::before {
            margin-right: .25em;
        }

        .divider:not(:empty)::after {
            margin-left: .25em;
        }

        body {
            position: relative;
            overflow-x: hidden;
            background:
                radial-gradient(ellipse at 14% 12%, rgba(37, 99, 235, 0.22), transparent 35%),
                radial-gradient(ellipse at 88% 90%, rgba(16, 185, 129, 0.14), transparent 30%),
                #f2f6fb;
            color: #14253d;
        }

        body::before {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(16, 42, 67, 0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(16, 42, 67, 0.025) 1px, transparent 1px);
            background-size: 38px 38px;
            content: "";
            pointer-events: none;
        }

        .auth-container {
            position: relative;
            z-index: 1;
            padding: clamp(1.75rem, 6vw, 2.6rem);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 28px 75px rgba(16, 42, 67, 0.13), 0 2px 8px rgba(16, 42, 67, 0.04);
            backdrop-filter: blur(18px);
            animation: auth-card-enter 0.5s ease-out both;
        }

        .auth-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.8rem;
        }

        .auth-header img {
            width: 68px;
            height: 68px;
            margin-bottom: 13px;
            border-radius: 19px;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18);
        }

        .auth-header .auth-brand {
            margin-bottom: 16px;
            color: #2563eb;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .auth-header h2 {
            color: #14253d;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.05em;
        }

        .auth-header .auth-subtitle {
            margin-top: 7px;
            color: #718096;
            font-size: 0.88rem;
            line-height: 1.55;
        }

        .form-group label {
            color: #33465f;
        }

        .form-group input {
            min-height: 48px;
            border-color: #dce4ee;
            border-radius: 10px;
            background: #f8fafc;
            color: #14253d;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .forgot-password,
        .auth-switch button {
            color: #1d4ed8;
            border: 0;
            background: transparent;
            transition: color 0.18s ease;
        }

        .forgot-password {
            padding: 0;
        }

        .forgot-password:hover,
        .auth-switch button:hover {
            color: #0f766e;
        }

        .auth-switch button {
            padding: 0;
            border: 0;
            background: transparent;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-auth,
        .btn-google {
            min-height: 48px;
            border-radius: 10px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
        }

        .btn-auth {
            background: linear-gradient(120deg, #1d4ed8, #2563eb 60%, #0f766e 150%);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
        }

        .btn-auth:hover:not(:disabled),
        .btn-google:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(16, 42, 67, 0.13);
        }

        .btn-auth:disabled,
        .btn-google:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .btn-google {
            border: 1px solid #dce4ee;
            background: #fff;
            color: #25364d;
        }

        .auth-switch,
        .divider {
            color: #718096;
        }

        button:focus-visible,
        input:focus-visible,
        a:focus-visible,
        #switchText:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.42);
            outline-offset: 3px;
        }

        @keyframes auth-card-enter {
            from { opacity: 0; transform: translateY(10px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-header">
            <img src="/acet/icon-192x192.png" alt="Kaizen Finanças">
            <span class="auth-brand">Kaizen Finanças</span>
            <h2 id="authTitle">Entrar no Sistema</h2>
            <p class="auth-subtitle">Organize seu dinheiro. Evolua todos os dias.</p>
        </div>
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <form id="authForm" novalidate>
            <div class="form-group"><label>E-mail</label><input type="email" id="email" placeholder="seu@email.com"
                    required></div>
            <div class="form-group" id="passwordGroup"><label>Senha</label><input type="password" id="password"
                    placeholder="••••••••" required minlength="6"></div>
            <button type="button" class="forgot-password" id="forgotPasswordBtn">Esqueci minha senha</button>
            <button type="submit" class="btn-auth" id="authBtn">Entrar no Painel</button>
        </form>
        <div class="divider" id="authDivider">OU</div>
        <button type="button" class="btn-google" id="googleBtn">
            <img src="https://img.ge/i/bX8Ao0.png" width="20" alt="Google">
            Entrar com Google
        </button>
        <div class="auth-switch"><button type="button" id="switchText">Não tem conta? Criar conta grátis</button></div>
    </div>

    <script type="module">
        import { auth } from './js/firebase-init.js';
        import { firebaseAuthentication } from './js/capacitor-firebase-auth.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithCredential, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        onAuthStateChanged(auth, (user) => { if (user) window.location.href = "/index.html"; });

        let isLogin = true;
        const form = document.getElementById('authForm');
        const authTitle = document.getElementById('authTitle');
        const authBtn = document.getElementById('authBtn');
        const switchText = document.getElementById('switchText');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        const googleBtn = document.getElementById('googleBtn');
        const passwordGroup = document.getElementById('passwordGroup');
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
        const authDivider = document.getElementById('authDivider');
        const isAndroidApp = window.Capacitor?.isNativePlatform?.() &&
            window.Capacitor.getPlatform() === 'android';

        let authMode = 'login';

        const clearMessages = () => {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        };

        const setResetMode = (isResetMode) => {
            authMode = isResetMode ? 'reset' : 'login';
            authTitle.innerText = isResetMode ? "Redefinir senha" : "Entrar no Sistema";
            authBtn.innerText = isResetMode ? "Enviar e-mail de recuperação" : "Entrar";
            passwordGroup.style.display = isResetMode ? 'none' : 'block';
            document.getElementById('password').required = !isResetMode;
            forgotPasswordBtn.style.display = isResetMode ? 'none' : 'block';
            googleBtn.style.display = isResetMode ? 'none' : 'flex';
            authDivider.style.display = isResetMode ? 'none' : 'flex';
            switchText.innerText = isResetMode ? "Voltar para o login" : "Não tem conta? Criar conta grátis";
            clearMessages();
        };

        switchText.addEventListener('click', () => {
            if (authMode === 'reset') {
                setResetMode(false);
                return;
            }

            isLogin = !isLogin;
            authMode = isLogin ? 'login' : 'register';
            authTitle.innerText = isLogin ? "Entrar no Sistema" : "Criar Nova Conta";
            authBtn.innerText = isLogin ? "Entrar" : "Cadastrar";
            switchText.innerText = isLogin ? "Não tem conta? Criar conta" : "Já tem conta? Fazer Login";
            forgotPasswordBtn.style.display = isLogin ? 'block' : 'none';
            clearMessages();
        });

        forgotPasswordBtn.addEventListener('click', () => setResetMode(true));

        // Autenticação Google
        googleBtn.addEventListener('click', async () => {
            googleBtn.disabled = true;
            clearMessages();
            try {
                if (isAndroidApp) {
                    if (!firebaseAuthentication) {
                        throw new Error('Autenticação nativa indisponível.');
                    }
                    const result = await firebaseAuthentication.signInWithGoogle();
                    const idToken = result.credential?.idToken;
                    if (!idToken) {
                        throw new Error('O Google não retornou um token de autenticação.');
                    }
                    await signInWithCredential(auth, GoogleAuthProvider.credential(idToken));
                } else {
                    await signInWithPopup(auth, new GoogleAuthProvider());
                }
            } catch (error) {
                console.error('Erro no login com Google:', error);
                errorMsg.style.display = 'block';
                errorMsg.innerText = isAndroidApp
                    ? `Não foi possível entrar com Google neste dispositivo${error?.code ? ` (${error.code})` : ''}.`
                    : "Erro no login social.";
                googleBtn.disabled = false;
            }
        });

        // Validação Front-End e Submissão
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            let isValid = true;

            [email, ...(authMode === 'reset' ? [] : [password])].forEach(input => {
                if (!input.value.trim() || !input.checkValidity()) {
                    input.classList.add('input-error');
                    isValid = false;
                } else input.classList.remove('input-error');
            });

            if (!isValid) return;

            clearMessages();
            authBtn.disabled = true;
            try {
                if (authMode === 'reset') {
                    await sendPasswordResetEmail(auth, email.value.trim());
                    successMsg.innerText = "E-mail enviado! Verifique sua caixa de entrada para trocar a senha.";
                    successMsg.style.display = 'block';
                } else if (isLogin) {
                    await signInWithEmailAndPassword(auth, email.value.trim(), password.value);
                } else {
                    await createUserWithEmailAndPassword(auth, email.value.trim(), password.value);
                }
            } catch (error) {
                errorMsg.style.display = 'block';
                if (authMode === 'reset' && error.code === 'auth/user-not-found') {
                    errorMsg.innerText = "Não encontramos uma conta com este e-mail.";
                } else if (error.code === 'auth/invalid-credential') {
                    errorMsg.innerText = "Credenciais incorretas.";
                } else {
                    errorMsg.innerText = authMode === 'reset' ? "Não foi possível enviar o e-mail de recuperação." : "Erro na autenticação.";
                }
            } finally {
                authBtn.disabled = false;
            }
        });
    </script>
    <!-- RODAPÉ DA TELA DE LOGIN (CORRIGIDO) -->
    <div style="position: absolute; bottom: 20px; left: 0; width: 100%; text-align: center; font-size: 0.85rem;">
        
        <!-- Links Legais -->
        <div style="margin-bottom: 30px;">
            <a href="termos.html" style="color: #94a3b8; text-decoration: none; font-weight: 600;">Termos de Uso</a> 
            <span style="color: #334155; margin: 0 8px;">|</span>
            <a href="privacidade.html" style="color: #94a3b8; text-decoration: none; font-weight: 600;">Política de Privacidade</a>
        </div>
        
</body>

</html>
