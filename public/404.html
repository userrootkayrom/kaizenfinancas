<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <title>404 - Página não encontrada | Kaizen Finanças</title>
    <script>
        if (window.location.hostname === 'kaizenfinancas.web.app') {
            window.location.replace(`https://kaizenfinancas.firebaseapp.com${window.location.pathname}${window.location.search}${window.location.hash}`);
        }
    </script>
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
    <style>
        :root {
            --background: #0b0f19;
            --surface: #111827;
            --primary: #3b82f6;
            --primary-strong: #2563eb;
            --text: #f9fafb;
            --text-light: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.22), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.13), transparent 28%),
                var(--background);
        }

        .error-card {
            position: relative;
            width: min(100%, 560px);
            padding: clamp(32px, 7vw, 64px) clamp(24px, 7vw, 58px);
            overflow: hidden;
            text-align: center;
            background: rgba(17, 24, 39, 0.88);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(14px);
        }

        .error-card::before,
        .error-card::after {
            content: "";
            position: absolute;
            width: 130px;
            height: 130px;
            border: 1px solid rgba(59, 130, 246, 0.18);
            border-radius: 50%;
            pointer-events: none;
        }

        .error-card::before {
            top: -72px;
            right: -42px;
        }

        .error-card::after {
            bottom: -78px;
            left: -42px;
        }

        .brand-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 18px;
        }

        .error-code {
            margin: 0;
            color: var(--primary);
            font-size: clamp(4.8rem, 18vw, 8.5rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.08em;
            text-shadow: 0 0 28px rgba(59, 130, 246, 0.35);
        }

        h1 {
            margin: 24px 0 10px;
            font-size: clamp(1.35rem, 4vw, 1.9rem);
        }

        .message {
            max-width: 410px;
            margin: 0 auto;
            color: var(--text-light);
            font-size: 1rem;
            line-height: 1.6;
        }

        .money-joke {
            display: inline-block;
            margin-top: 8px;
            color: #fbbf24;
            font-weight: 700;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 150px;
            padding: 13px 20px;
            color: var(--text);
            font-weight: 700;
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.55);
        }

        .button-primary {
            background: linear-gradient(135deg, var(--primary-strong), var(--primary));
            border-color: transparent;
        }

        .button-secondary {
            background: rgba(255, 255, 255, 0.04);
        }

        @media (max-width: 420px) {
            body {
                padding: 14px;
            }

            .error-card {
                border-radius: 22px;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="error-card">
        <img class="brand-logo" src="/icons/icon-192x192.png" alt="Logo Kaizen Finanças">
        <p class="error-code" aria-label="Erro 404">404</p>
        <h1>Essa página saiu para economizar.</h1>
        <p class="message">
            Procuramos em todos os lugares, mas ela não estava nem no extrato.
            <span class="money-joke">Talvez tenha virado uma despesa invisível. 👀</span>
        </p>
        <nav class="actions" aria-label="Navegação da página de erro">
            <a class="button button-primary" href="/">Voltar ao início</a>
            <a class="button button-secondary" href="/login.html">Ir para o login</a>
        </nav>
    </main>
</body>

</html>
